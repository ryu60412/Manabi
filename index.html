<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>まなびランド</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh}
body{font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.theme-girl{--main:#ff5c9a;--main2:#ffb3d1;--sub:#a78bfa;--bg1:#fff0f7;--bg2:#ffe0f0;--ink:#6b3a57;--card:#fffafd}
.theme-boy{--main:#2b7bff;--main2:#9cc9ff;--sub:#16b364;--bg1:#eaf4ff;--bg2:#d3ebff;--ink:#1e3a5f;--card:#fbfdff}
.theme-none{--main:#ff8a3c;--main2:#ffd29c;--sub:#4cc9f0;--bg1:#fff6e5;--bg2:#e6f5ff;--ink:#4a3b2f;--card:#fffdf8}
#app{max-width:1000px;margin:0 auto;padding:12px 14px 50px}
button{font-family:inherit}
.btn{border:none;border-radius:18px;padding:12px 22px;font-weight:800;font-size:18px;background:var(--main);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.sub{background:#fff;color:var(--main);box-shadow:0 5px 0 rgba(0,0,0,.12);border:3px solid var(--main)}
.btn.green{background:#22c55e}.btn.gold{background:linear-gradient(180deg,#ffd54a,#ffab00);color:#5a3a00}
.btn.small{font-size:15px;padding:8px 14px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.top h2{margin:0;font-size:26px}
.coin{background:#fff;border-radius:999px;padding:6px 16px;font-weight:900;font-size:22px;box-shadow:0 3px 0 #0001;color:#c98a00;white-space:nowrap}
.card{background:var(--card);border-radius:26px;box-shadow:0 6px 0 rgba(0,0,0,.07),0 2px 12px rgba(0,0,0,.06);padding:18px}
.center{text-align:center}
.title-logo{font-size:56px;font-weight:900;text-align:center;margin:20px 0 4px;background:linear-gradient(90deg,#ff5c9a,#ff9a3c,#ffd23f,#22c55e,#2b7bff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:4px}
.subtitle{text-align:center;font-size:18px;margin-bottom:20px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pcard{background:#fff;border-radius:22px;padding:12px;text-align:center;cursor:pointer;border:4px solid transparent;box-shadow:0 5px 0 #0001}
.pcard:hover{border-color:var(--main2)}
.pcard svg{width:100%;height:130px}
.pcard b{font-size:22px;display:block}
.newcard{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--main);border:4px dashed var(--main2);background:#ffffffaa;min-height:200px}
.newcard span{font-size:60px}
/* create */
.typesel{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.typebtn{border:5px solid transparent;border-radius:24px;background:#fff;padding:14px;cursor:pointer;font-size:22px;font-weight:900;box-shadow:0 5px 0 #0001}
.typebtn.on.girl{border-color:#ff5c9a;background:#fff0f7}.typebtn.on.boy{border-color:#2b7bff;background:#eef6ff}
.typebtn span{font-size:64px;display:block}
.inp{font-size:24px;padding:12px 16px;border-radius:16px;border:3px solid var(--main2);width:100%;font-family:inherit;outline:none;color:var(--ink)}
.inp:focus{border-color:var(--main)}
.maker{display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:16px;align-items:start}
.maker .preview{background:radial-gradient(circle at 50% 40%,#fff,var(--bg2));border-radius:26px;padding:10px}
.maker .preview svg{width:100%;height:360px}
.opt h4{margin:12px 0 6px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid #0000;background:#fff;border-radius:14px;padding:8px 14px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #0001;color:var(--ink)}
.chip.on{border-color:var(--main);background:var(--bg1)}
.sw{width:44px;height:44px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #0002;cursor:pointer}
.sw.on{box-shadow:0 0 0 4px var(--main)}
/* home */
.home{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:18px}
.stage{position:relative;border-radius:30px;overflow:hidden;min-height:380px;display:flex;align-items:flex-end;justify-content:center}
.stage.girl{background:radial-gradient(circle at 50% 30%,#fff 0,#ffe3f1 55%,#ffc9e2 100%)}
.stage.girl svg{width:88%;height:370px;animation:bob 2.4s ease-in-out infinite}
.stage.boy{background:linear-gradient(#bfe3ff 0,#e6f4ff 58%,#7fd27f 58%,#5cbf5c 66%,#666 66%)}
.stage.boy .road{position:absolute;left:0;right:0;bottom:46px;height:6px;background:repeating-linear-gradient(90deg,#fff 0 40px,transparent 40px 80px);animation:road .6s linear infinite}
.stage.boy svg{width:96%;height:auto;margin-bottom:24px;animation:bump .35s ease-in-out infinite;position:relative}
.stage .bubble{position:absolute;top:14px;left:14px;right:14px;background:#fff;border-radius:18px;padding:10px 14px;font-weight:800;font-size:17px;box-shadow:0 4px 0 #0001}
.stage .cloud{position:absolute;font-size:40px;opacity:.9;animation:cloud 18s linear infinite}
.stage .spark{position:absolute;font-size:24px;animation:twinkle 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bump{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes road{from{background-position:0 0}to{background-position:-80px 0}}
@keyframes cloud{from{transform:translateX(420px)}to{transform:translateX(-120px)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border:none;border-radius:26px;padding:16px 10px;cursor:pointer;color:#fff;font-weight:900;font-size:24px;box-shadow:0 6px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .1s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile .ic{font-size:50px;line-height:1.1}
.tile small{font-size:13px;font-weight:700;opacity:.95}
.t-kokugo{background:linear-gradient(160deg,#ff8a8a,#ff5c6c)}
.t-sansu{background:linear-gradient(160deg,#5cc8ff,#2b8bff)}
.t-eigo{background:linear-gradient(160deg,#6ee7a8,#16b364)}
.t-puzzle{background:linear-gradient(160deg,#ffcf5c,#ff9f1c)}
.t-gacha{background:linear-gradient(160deg,#c49bff,#8b5cf6)}
.t-dress{background:linear-gradient(160deg,#ff9ed2,#ff5c9a)}
.t-garage{background:linear-gradient(160deg,#7aa7ff,#3a5bd9)}
/* subject */
.catrow{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;background:#fff;border-radius:22px;padding:12px 14px;margin-bottom:12px;box-shadow:0 4px 0 #0001}
.caticon{font-size:46px;text-align:center}
.catinfo b{font-size:22px}
.catinfo small{display:block;font-size:14px;opacity:.85}
.diffs{display:flex;gap:6px;margin:6px 0 2px;flex-wrap:wrap}
.pill{border:3px solid var(--main2);background:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink)}
.pill.on{background:var(--main);border-color:var(--main);color:#fff}
.ddesc{color:var(--main);font-weight:800}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prog{flex:1;height:18px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 4px #0002}
.prog div{height:100%;background:linear-gradient(90deg,var(--main2),var(--main));transition:width .4s}
.qcard{background:#fff;border-radius:28px;padding:18px;text-align:center;box-shadow:0 6px 0 #0001;position:relative;margin-bottom:14px}
.qno{font-weight:800;color:var(--main)}
.qprompt{font-size:26px;font-weight:900;margin:8px 0;line-height:1.5}
.qbig{font-size:90px;line-height:1.2;margin:6px 0;word-break:break-word}
.qbig.txt{font-size:64px;font-weight:900}
.qbig.eq{font-size:58px;font-weight:900;letter-spacing:2px}
.qbig .qword{font-size:54px;font-weight:900;letter-spacing:6px}
.qbig .emogrid{font-size:40px;line-height:1.3;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:520px;margin:0 auto}
.qbig .emogrid span.g{display:inline-flex;gap:2px;padding:2px 6px;border:2px dashed #0002;border-radius:12px;margin:2px}
.qbig .seq{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.qbig .seq span{min-width:70px;padding:8px 10px;border-radius:16px;background:var(--bg1);font-size:42px;font-weight:900}
.qbig .seq span.q{background:var(--main);color:#fff}
.qbig .talk{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.qbig .talk .who{font-size:70px}
.qbig .talk .say{background:var(--bg1);border-radius:22px;padding:12px 18px;font-size:30px;font-weight:800;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;position:relative;text-align:left}
.qbig .talk .say small{display:block;font-size:16px;opacity:.8;font-family:inherit}
.qbig .wp{font-size:24px;font-weight:800;text-align:left;line-height:1.7;max-width:640px;margin:0 auto}
.qbig .wp .e{font-size:54px;float:left;margin-right:10px}
.clock{width:220px;height:220px}
.spk{position:absolute;right:14px;top:14px;border:none;background:var(--bg1);border-radius:50%;width:50px;height:50px;font-size:24px;cursor:pointer;box-shadow:0 3px 0 #0001}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices.c3{grid-template-columns:1fr 1fr 1fr}
.ch{border:none;background:#fff;border-radius:22px;padding:16px 8px;font-size:28px;font-weight:900;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 #0002;min-height:76px;transition:transform .08s;word-break:break-word}
.ch.en{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:24px}
.ch.emo{font-size:52px;padding:8px}
.ch.long{font-size:20px}
.ch:active{transform:translateY(3px)}
.ch.ok{background:#3ccf6e;color:#fff;animation:pop .4s}
.ch.ng{background:#ff6b6b;color:#fff;animation:shake .4s}
.ch.dim{opacity:.45}
.ch:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fb{margin-top:14px;border-radius:22px;padding:14px;text-align:center;font-size:22px;font-weight:900;animation:pop .35s}
.fb.ok{background:#e6fbe9;color:#16803c}.fb.ng{background:#ffecec;color:#c62828}
.fb .big{font-size:40px}
.fb .after{font-size:18px;font-weight:700;margin:6px 0 10px;color:var(--ink)}
/* result */
.stars{font-size:70px;letter-spacing:6px}
.stars .off{filter:grayscale(1);opacity:.3}
.reward{font-size:30px;font-weight:900;color:#c98a00;margin:10px 0}
/* memory */
.mgrid{display:grid;gap:10px;max-width:560px;margin:0 auto}
.mc{aspect-ratio:1;border-radius:18px;border:none;cursor:pointer;font-size:46px;background:var(--main);color:#fff;box-shadow:0 5px 0 #0002;transition:transform .25s,background .25s}
.mc.up{background:#fff;transform:rotateY(180deg)}
.mc.up span{transform:rotateY(180deg);display:inline-block}
.mc.done{background:#e6fbe9;opacity:.8}
.mc .bk{font-size:34px}
/* slide */
.sgrid{display:grid;gap:8px;max-width:420px;margin:0 auto;background:#fff;padding:10px;border-radius:22px;box-shadow:0 6px 0 #0001}
.st{aspect-ratio:1;border:none;border-radius:16px;font-size:34px;font-weight:900;color:#fff;background:linear-gradient(160deg,var(--main2),var(--main));cursor:pointer;box-shadow:0 4px 0 #0002}
.st.e{background:transparent;box-shadow:none;cursor:default}
.st.good{background:linear-gradient(160deg,#8ff0b5,#22c55e)}
/* gacha */
.gwrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}
.machine{position:relative;width:280px;height:400px;margin:0 auto}
.dome{position:absolute;left:20px;top:0;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffffee,#ffffff66 40%,#cfe9ff88 100%);border:8px solid var(--main);overflow:hidden;z-index:2}
.dome .cap{position:absolute;width:52px;height:52px;border-radius:50%;border:2px solid #0002}
.rolling .dome .cap{animation:jig .25s infinite alternate}
@keyframes jig{from{transform:translate(-4px,2px) rotate(-20deg)}to{transform:translate(4px,-3px) rotate(20deg)}}
.gbase{position:absolute;left:30px;top:220px;width:220px;height:170px;background:linear-gradient(180deg,var(--main),var(--main2));border-radius:20px 20px 30px 30px;z-index:1;box-shadow:0 8px 0 #0002}
.handle{position:absolute;left:58px;top:40px;width:70px;height:70px;border-radius:50%;background:#fff;border:6px solid #0002;transition:transform 1s cubic-bezier(.5,0,.3,1)}
.handle::after{content:"";position:absolute;left:26px;top:-2px;width:6px;height:62px;background:#888;border-radius:4px}
.slot{position:absolute;right:20px;top:90px;width:64px;height:56px;background:#0005;border-radius:12px}
.gprice{position:absolute;left:20px;top:122px;font-weight:900;color:#fff;font-size:18px;text-shadow:0 2px 0 #0003}
.drop{position:absolute;right:46px;top:300px;width:70px;height:70px;z-index:5;cursor:pointer;display:none}
.drop.show{display:block;animation:drop .7s cubic-bezier(.3,1.6,.6,1)}
.drop .h1,.drop .h2{position:absolute;left:0;width:70px;height:35px;border:2px solid #0002}
.drop .h1{top:0;border-radius:35px 35px 0 0}
.drop .h2{top:35px;border-radius:0 0 35px 35px;background:#fff}
.drop.open .h1{animation:lid .5s forwards}
@keyframes drop{from{transform:translate(-10px,-80px) scale(.3)}to{transform:none}}
@keyframes lid{to{transform:translate(-30px,-60px) rotate(-60deg);opacity:0}}
.tapmsg{text-align:center;font-weight:900;font-size:20px;color:var(--main);min-height:30px;animation:twinkle 1.2s infinite}
.reveal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.rcard{background:#fff;border-radius:30px;padding:20px;text-align:center;max-width:420px;width:100%;animation:popin .5s cubic-bezier(.3,1.6,.6,1);position:relative;overflow:hidden}
.rcard svg{width:100%;height:260px}
.rcard .rar{font-size:26px;font-weight:900;padding:4px 16px;border-radius:999px;color:#fff;display:inline-block}
.rcard .nm{font-size:26px;font-weight:900;margin:6px 0}
.rcard .new{color:#ff3b6b;font-size:24px;font-weight:900}
.rcard.sr{box-shadow:0 0 0 6px #ffd700,0 0 40px 10px #ffd700aa}
.rcard.r{box-shadow:0 0 0 6px #c084fc}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.rays{position:absolute;inset:-50%;background:repeating-conic-gradient(#fff6c8 0 10deg,#fff 10deg 20deg);animation:spin 8s linear infinite;z-index:0;opacity:.8}
.rcard>*:not(.rays){position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
/* wardrobe */
.wr{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:16px;align-items:start}
.wr .preview{background:radial-gradient(circle at 50% 35%,#fff,var(--bg2));border-radius:26px;padding:8px;position:sticky;top:10px}
.wr .preview svg{width:100%;height:380px}
.wr .preview.car svg{height:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:none;border-radius:14px 14px 6px 6px;padding:10px 14px;font-weight:900;font-size:16px;background:#fff;color:var(--ink);cursor:pointer;opacity:.7}
.tab.on{background:var(--main);color:#fff;opacity:1}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.it{background:#fff;border-radius:18px;border:4px solid transparent;padding:6px;cursor:pointer;text-align:center;box-shadow:0 4px 0 #0001;position:relative}
.it svg{width:100%;height:92px}
.it .n{font-size:12px;font-weight:800;line-height:1.3;min-height:30px}
.it.on{border-color:var(--main);background:var(--bg1)}
.it.lock{cursor:default;background:#f1f1f4;color:#aaa}
.it.lock .q{font-size:52px;height:92px;line-height:92px;font-weight:900;color:#c9c9d3}
.it .rs{position:absolute;top:4px;left:6px;font-size:11px;font-weight:900}
.it .none{font-size:44px;height:92px;line-height:92px}
.cnt{font-weight:900;color:var(--main)}
/* modal */
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}
.mbox{background:#fff;border-radius:26px;padding:20px;max-width:420px;width:100%}
.mbox h3{margin:0 0 12px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:2px dashed #0001;gap:10px;font-weight:800}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#fff;padding:10px 20px;border-radius:999px;font-weight:900;box-shadow:0 6px 20px #0003;z-index:80;animation:popin .3s}
@media (max-width:720px){
 .home,.maker,.wr,.gwrap{grid-template-columns:1fr}
 .stage{min-height:300px}.stage.girl svg{height:290px}
 .qbig{font-size:70px}.qprompt{font-size:22px}.ch{font-size:22px}.ch.emo{font-size:42px}
 .catrow{grid-template-columns:50px 1fr}.catrow .btn{grid-column:1/3}
 .wr .preview{position:static}.wr .preview svg{height:300px}
 .title-logo{font-size:42px}
}
</style>
</head>
<body class="theme-none">
<div id="app"></div>
<script>
'use strict';
/* ========== ユーティリティ ========== */
const rnd=n=>Math.floor(Math.random()*n);
const ri=(a,b)=>a+rnd(b-a+1);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample=(a,n)=>shuffle(a).slice(0,n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
let UID=0;

/* ========== 保存 ========== */
const KEY='manabiLand_v1';
let DB;
function load(){try{DB=JSON.parse(localStorage.getItem(KEY));}catch(e){DB=null;}
 if(!DB||!Array.isArray(DB.profiles))DB={profiles:[],current:null,sound:true,voice:true};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
const cur=()=>DB.profiles.find(p=>p.id===DB.current);

/* ========== 音・よみあげ ========== */
let AC=null;
function tone(seq){if(!DB.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
 for(const[f,d,type]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8;}}catch(e){}}
const SFX={ok:()=>tone([[660,.12],[880,.12],[1320,.25]]),ng:()=>tone([[240,.22,'square'],[180,.3,'square']]),coin:()=>tone([[988,.08],[1319,.22]]),tap:()=>tone([[700,.05]]),
 roll:()=>tone([[300,.08,'triangle'],[340,.08,'triangle'],[380,.08,'triangle'],[420,.08,'triangle'],[460,.08,'triangle'],[500,.1,'triangle']]),
 fan:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.45]])};
const hasTTS='speechSynthesis' in window;
function speak(text,lang,force){if(!hasTTS)return;if(!force&&!DB.voice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=lang.startsWith('en')?.85:.95;
 const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').toLowerCase().startsWith(lang.toLowerCase()));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
if(hasTTS){try{speechSynthesis.getVoices();}catch(e){}}

/* ========== SVG 共通 ========== */
function starPath(cx,cy,R,r,pts=5){let d='';for(let i=0;i<pts*2;i++){const a=-Math.PI/2+i*Math.PI/pts,rr=i%2?r:R;d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1);}return d+'Z';}
function heartPath(x,y,s){return `M${x} ${y+s*.9} C${x-s*1.2} ${y+s*.1} ${x-s*.6} ${y-s*.8} ${x} ${y-s*.2} C${x+s*.6} ${y-s*.8} ${x+s*1.2} ${y+s*.1} ${x} ${y+s*.9}Z`;}
function paint(pat,c,c2,defs){

 if(pat==='rainbow'){defs.push(`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b6b"/><stop offset=".2" stop-color="#ffb347"/><stop offset=".4" stop-color="#fff275"/><stop offset=".6" stop-color="#7ee081"/><stop offset=".8" stop-color="#6ec6ff"/><stop offset="1" stop-color="#b38cff"/></linearGradient>`);return `url(#${id})`;}
 if(pat==='gold'){defs.push(`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6b0"/><stop offset=".45" stop-color="#ffd23f"/><stop offset=".55" stop-color="#e0a800"/><stop offset="1" stop-color="#ffe680"/></linearGradient>`);return `url(#${id})`;}
 const P={stripe:[12,12,`<rect width="12" height="6" fill="${c2}"/>`],dot:[14,14,`<circle cx="7" cy="7" r="3" fill="${c2}"/>`],
  star:[20,20,`<path d="${starPath(10,10,5,2.2)}" fill="${c2}"/>`],heart:[18,18,`<path d="${heartPath(9,9,4)}" fill="${c2}"/>`],
  check:[16,16,`<rect width="8" height="8" fill="${c2}"/><rect x="8" y="8" width="8" height="8" fill="${c2}"/>`]};
 const p=P[pat];if(!p)return c;
 defs.push(`<pattern id="${id}" width="${p[0]}" height="${p[1]}" patternUnits="userSpaceOnUse"><rect width="${p[0]}" height="${p[1]}" fill="${c}"/>${p[2]}</pattern>`);
 return `url(#${id})`;
}

function mc(ans,pool,n){const w=sample([...new Set(pool)].filter(x=>x!==ans),n-1);return shuffle([ans,...w]);}
function numMC(ans,n,extra){const set=new Set([ans]);const cand=shuffle((extra||[]).concat([ans+1,ans-1,ans+2,ans-2,ans+10,ans-10]).filter(v=>v>=0&&v!==ans));
 for(const c of cand){if(set.size>=n)break;set.add(c);}let t=0;while(set.size<n&&t<99){t++;const v=ans+ri(-5,5);if(v>=0)set.add(v);}return shuffle([...set]);}
function confuse(word,groups,k,fb){const out=new Set();let t=0;const chars=[...word];
 while(out.size<k&&t<300){t++;const i=rnd(chars.length),ch=chars[i];const g=groups.find(g=>g.includes(ch));
  const rep=g&&Math.random()<.85?pick(g.filter(x=>x!==ch)):pick(fb);if(rep===ch)continue;
  const w=chars.slice(0,i).join('')+rep+chars.slice(i+1).join('');if(w!==word)out.add(w);}
 return [...out];}

 const p=cur(),d=p.diff[sk+'.'+ck]||1;const n=d===1?3:4;const list=[];const keys=new Set();let t=0;
 while(list.length<NQ&&t<400){t++;const q=GEN[ck](d,n);const k=q.key||(String(q.big)+q.ans);if(keys.has(k)&&t<300)continue;keys.add(k);list.push(q);}

 <div class="choices ${cc}">${q.choices.map((c,i)=>`<button class="ch ${q.cCls||''}" data-act="answer" data-i="${i}">${esc(c)}</button>`).join('')}</div>
 <div id="fb"></div>`,p.type);
 Q.done=false;
 if(q.autoSpeak&&q.speak)setTimeout(()=>speak(q.speak.t,q.speak.l,true),350);}
function answer(i){
 if(Q.done)return;Q.done=true;const p=cur(),q=Q.list[Q.i],v=q.choices[i],ok=v===q.ans;
 document.querySelectorAll('.ch').forEach((b,j)=>{b.disabled=true;const c=q.choices[j];if(c===q.ans)b.classList.add('ok');else if(j===i)b.classList.add('ng');else b.classList.add('dim');});
 let html;
 if(ok){Q.ok++;const g=Q.d;Q.coins+=g;p.coins+=g;p.stats.ok=(p.stats.ok||0)+1;SFX.ok();

 else{SFX.ng();html=`<div class="fb ng"><div class="big">❌ ざんねん…</div><div>こたえは「${esc(q.ans)}」</div>`;}
 p.stats.q=(p.stats.q||0)+1;save();

function startSlide(d){const N=d===3?4:3;const moves=[15,60,140][d-1];let t=[...Array(N*N).keys()].map(x=>(x+1)%(N*N));let e=N*N-1,prev=-1;
 for(let k=0;k<moves;k++){const nb=nbrs(e,N).filter(x=>x!==prev);const m=pick(nb);[t[e],t[m]]=[t[m],t[e]];prev=e;e=m;}
 if(solved(t))return startSlide(d);G={kind:'slide',d,N,t,moves:0};renderSlide();}
function nbrs(i,N){const r=Math.floor(i/N),c=i%N,o=[];if(r>0)o.push(i-N);if(r<N-1)o.push(i+N);if(c>0)o.push(i-1);if(c<N-1)o.push(i+1);return o;}
function solved(t){return t.every((v,i)=>v===(i+1)%t.length);}
function renderSlide(){const p=cur();
 show(`<div class="top">${backBtn('subjectPuzzle','✖ やめる')}<h2>🔲 スライドパズル</h2><div class="coin" id="mv">うごかした かいすう ${G.moves}</div></div>
 <p class="center" style="font-weight:800;margin-top:0">となりの すきまに タイルを うごかして 1から じゅんばんに ならべよう！</p>
 <div class="sgrid" id="sg" style="grid-template-columns:repeat(${G.N},1fr)"></div>`,p.type);drawSlide();}
function drawSlide(){document.getElementById('sg').innerHTML=G.t.map((v,i)=>v?`<button class="st ${v===i+1?'good':''}" data-act="slide" data-i="${i}">${v}</button>`:`<div class="st e"></div>`).join('');document.getElementById('mv').textContent='うごかした かいすう '+G.moves;}
function slide(i){const e=G.t.indexOf(0);if(!nbrs(e,G.N).includes(i))return;[G.t[e],G.t[i]]=[G.t[i],G.t[e]];G.moves++;SFX.tap();drawSlide();if(solved(G.t))setTimeout(gameClear,400);}
function gameClear(){const p=cur();const coins=[6,10,15][G.d-1];p.coins+=coins;save();SFX.fan();
 const ck=G.kind;let st=3;if(ck==='memory'){st=G.moves<=G.pairs*1.6?3:G.moves<=G.pairs*2.5?2:1;}
 showResult(ck==='memory'?`${G.moves}かいで ぜんぶ そろえた！`:`${G.moves}かいで かんせい！`,st,coins,'',`startCat" data-s="puzzle" data-c="${ck}`,'puzzle');}

 newProfile(){NEWP=null;screenCreate();},
 ptype(el){NEWP.type=el.dataset.v;SFX.tap();screenCreate();},
 look(el){const k=el.dataset.k;NEWP.look[k]=k==='hair'||k==='eyes'?el.dataset.v:+el.dataset.v;screenCreate();},
 createDone(){const name=(NEWP.name||'').trim();if(!name){toast('なまえを いれてね！');document.getElementById('pname').focus();return;}if(!NEWP.type)return;
  const t=NEWP.type;const p={id:'p'+Date.now(),name,type:t,coins:20,owned:itemsOf(t).filter(i=>i.def).map(i=>i.id),
   eq:t==='girl'?{tops:'tp1',bottoms:'bt1',shoes:'sh1',acc:null,hat:null}:{type:'ct1',body:'cb1',tire:'tr1',wing:null,acc:null},
   look:Object.assign({},NEWP.look),diff:{},stats:{q:0,ok:0}};
  DB.profiles.push(p);DB.current=p.id;save();NEWP=null;SFX.fan();screenHome();toast('🎁 プレゼント：20コイン！ ガチャを まわしてみよう！');},
 home(){closeReveal();screenHome();},
 subject(el){closeReveal();screenSubject(el.dataset.s);},
 subjectPuzzle(){screenSubject('puzzle');},
 setDiff(el){const p=cur();p.diff[el.dataset.k]=+el.dataset.d;save();SFX.tap();const y=window.scrollY;screenSubject(el.dataset.s);window.scrollTo(0,y);},
 startCat(el){closeReveal();const s=el.dataset.s,c=el.dataset.c;const p=cur();const d=p.diff[s+'.'+c]||1;
  if(c==='memory')return startMemory(d);if(c==='slide')return startSlide(d);startQuiz(s,c);},
 answer(el){answer(+el.dataset.i);},
 nextQ(){nextQ();},
 quitQuiz(){if(Q&&Q.coins>0)toast(`🪙 ${Q.coins}コイン ゲットしたよ`);screenSubject(Q.sk);},
 speakQ(){const q=Q.list[Q.i];if(q.speak)speak(q.speak.t,q.speak.l,true);else speak(q.prompt.replace(/<[^>]+>/g,'').replace('□','しかく'),'ja-JP',true);},
 flip(el){flip(+el.dataset.i);},
 slide(el){slide(+el.dataset.i);},
 gacha(){closeReveal();ROLL=null;screenGacha();},
 roll(){roll();},
 openCap(){openCap();},
 gachaAgain(){closeReveal();screenGacha();setTimeout(roll,200);},
 closeReveal(){closeReveal();screenGacha();},
 equipNew(el){const p=cur(),it=ITEM[el.dataset.id];p.eq[it.cat]=it.id;save();closeReveal();WTAB=it.cat;screenWardrobe();},
 wardrobe(){screenWardrobe();},
 wtab(el){WTAB=el.dataset.v;SFX.tap();screenWardrobe();},
 equip(el){const p=cur();const id=el.dataset.id;p.eq[WTAB]=id||null;save();SFX.tap();const y=window.scrollY;screenWardrobe();window.scrollTo(0,y);},
 wlook(el){const p=cur(),k=el.dataset.k;p.look[k]=k==='hair'||k==='eyes'?el.dataset.v:+el.dataset.v;save();const y=window.scrollY;screenWardrobe();window.scrollTo(0,y);},
 settings(){settings();},
 closeModal(){closeModal();screenHome();},
 tgl(el){DB[el.dataset.k]=!DB[el.dataset.k];save();closeModal();settings();},
 rename(){const p=cur();const n=prompt('あたらしい なまえ',p.name);if(n&&n.trim()){p.name=n.trim().slice(0,10);save();closeModal();screenHome();}},
 parentCoin(){const a=ri(12,19),b=ri(3,9);const r=prompt(`おうちの ひと かくにん：${a} × ${b} = ?`);if(r===null)return;if(+r!==a*b){toast('ちがうよ');return;}
  const n=parseInt(prompt('なんコイン あげますか？（1〜100）','10'),10);if(!(n>0))return;const p=cur();p.coins+=Math.min(n,100);save();closeModal();screenHome();toast(`🪙 ${Math.min(n,100)}コイン もらったよ！`);},
 delProfile(){const p=cur();if(!confirm(`「${p.name}」の データを ぜんぶ けします。よろしいですか？`))return;DB.profiles=DB.profiles.filter(x=>x.id!==p.id);DB.current=null;save();closeModal();screenTitle();},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f)f(el,e);});

/* ========== 起動 ========== */
load();
if(cur())screenHome();else screenTitle();
</script>
</body>
</html>
